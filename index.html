<!doctype html>
<html lang="en">
  <head>
    <!--
      HEAD:
      - Metadata: charset + viewport for responsive layout
      - Title shown in the browser tab
      - Link to the stylesheet that controls all design and layout
    -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Gallery</title>
    
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
  </head>

  <body>
     <!--
      STICKY HEADER / TOP NAV:
      - Stays at top (CSS position: sticky)
      - Contains the "brand" (your name) and section links
      - Clicking nav items jumps to anchors (#artworks, #about, #contact)
    -->
    <!-- Top navigation (minimal) -->
    <header class="site-header" id="siteHeader">
      <div class="shell">
        <!--
          BRAND / NAME:
          - This is the text you want to animate letter-by-letter (Option B).
          - We add id="siteBrand" so JS can split it into spans.
          - aria-label preserves the full readable name for screen readers.
        -->
        <a class="brand" id="siteBrand" aria-label="Henrike Fechler" href="#top">
          <span class="brand-text">Henrike Fechler</span>
        </a>

        <!-- Mobile menu toggle -->
        <button
          class="nav-toggle"
          type="button"
          aria-label="Open menu"
          aria-expanded="false"
          aria-controls="siteNav"
          id="navToggle"
        >
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
        </button>

        <!-- Navigation -->
        <nav class="nav" id="siteNav">
          <!-- <a href="#artworks">ARTWORKS</a> -->
          <a href="gallery.html">GALLERY</a>
          <a href="#cv">CV</a>
          <a href="#contact">CONTACT</a>
        </nav>

        <!-- <nav class="nav">
          <a href="#artworks">ARTWORKS</a>
          <a href="gallery.html">GALLERY</a>
          <a href="#about">ABOUT</a>
          <a href="#contact">CONTACT</a>
        </nav> -->
      </div>
    </header>

    <!-- Full-viewport hero slideshow -->
      <!--
      HERO SECTION:
      - Full-viewport slideshow background
      - The images are absolutely positioned; CSS animates opacity (cross-fade)
      - Overlay adds gradient + text and a "Scroll" CTA
    -->
    <section class="hero" id="top" aria-label="Featured works">
      <div class="hero-slides">
        <!-- Replace these with your own hero images -->
        
        -->
        <img class="hero-slide" src="IMG_3349.jpeg" alt="close up Schären"/>
        <img class="hero-slide" src="IMG_7474.jpeg" alt="close up Schweden"/>
        </div>

      <!-- HERO OVERLAY:
           - Visual: gradient overlay to improve readability over images
           - Text: kicker + subtitle
           - CTA: anchor jump down to the artworks section
      -->
      <div class="hero-overlay">
        <div class="hero-copy">
          <div class="hero-kicker"></div>
          <!-- <div class="hero-sub">A minimalist portfolio layout that prioritizes the image.</div> -->
        </div>
        <a class="hero-cta" href="#artworks"></a>
      </div>
    </section>

    <!--
      MAIN CONTENT WRAPPER (.shell):
      - Centers content and limits max width (CSS --max)
      - Contains your 3 sections: artworks, about, contact
    -->
    <main class="shell">
      <!-- Works / “selected works” section -->
       <!--
        ARTWORKS SECTION:
        - "Selected works" header area
        - Optional highlight block
        - Editorial list: each work is an <article> with image + metadata
      -->
      
      
      <section class="section" id="cv">
        <header class="section-head">
          <h2 class="section-title">CV</h2>
          <p class="section-note preline" id="cvText"></p>
        </header>
      </section>

      <section class="section" id="contact">
        <header class="section-head">
          <h2 class="section-title">Contact</h2>
          <p class="section-note">
            Email: <a href="mailto:henrike.fechler@gmx.de">henrike.fechler@gmx.de</a>
          </p>
          <p class="section-note">
            Instagram: <a href="instagramm:">henrikefechler</a>
          </p>
        </header>
      </section>
    </main>

    <!-- LIGHTBOXES (pure CSS :target) -->
     <!--
      LIGHTBOXES (CSS-only using :target):
      - Clicking a work uses href="#full-work-01" etc.
      - The corresponding <div id="full-work-01"> becomes :target and displays
      - Close button is a link back to "#work-01" (removes :target from lightbox)
    -->

      <div class="lightbox-caption">Title 03 — Acrylic • 50 × 70 cm • 2026</div>
    </div> -->

    <!-- FOOTER -->
    <footer class="site-footer">
      <div class="shell">
        <small>© <span id="year"></span> Henrike Fechler</small>
      </div>
    </footer>

    <!--
      SCRIPT:
      - Sets the year in the footer
      - Option B: splits the brand name into <span class="char">...</span>
        and each character fades in with a staggered delay.
    -->

    <script src="main.js"></script>

  </body>
</html>
